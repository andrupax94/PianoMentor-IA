# description: Stack del servidor casero: Nginx como proxy inverso + PianoMentor AI.
# context: Se ejecuta en el HP con KDE neon desde la carpeta deploy/. No sustituye
#          al docker-compose.yml de desarrollo de la raíz.

name: pianomentor-host

services:
  # ---------------------------------------------------------------- proxy ---
  nginx:
    image: nginx:1.27-alpine
    container_name: pm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Reto HTTP-01 de Let's Encrypt: Nginx lo sirve, certbot lo escribe.
      - certbot_webroot:/var/www/certbot:ro
      # Certificados emitidos por certbot.
      - certbot_conf:/etc/letsencrypt:ro
    # Nginx lee el certificado al arrancar, no en cada peticion. Como certbot
    # renueva en otro contenedor, aqui un bucle recarga Nginx cada 6 h para que
    # tome el nuevo. Sin esto, la renovacion no serviria de nada hasta el
    # siguiente reinicio del contenedor.
    command:
      - /bin/sh
      - -c
      - while :; do sleep 6h; nginx -s reload; done & exec nginx -g 'daemon off;'
    networks:
      - web

  # ------------------------------------------------------------ certbot ---
  # Renueva los certificados cada 12 h. El reto HTTP-01 lo sirve Nginx desde
  # el volumen compartido, asi que la renovacion no necesita parar nada.
  # Nginx lo recarga solo cada 6 h (ver el `command` de arriba).
  certbot:
    image: certbot/certbot:latest
    container_name: pm-certbot
    restart: unless-stopped
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

  # ------------------------------------------------------------- backend ---
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: pianomentor-backend:prod
    container_name: pm-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # El .env de desarrollo dice APP_ENV, que el backend ignora; la variable
      # que manda es ENVIRONMENT. En producción desactiva /api/v1/dev/*.
      ENVIRONMENT: production
      MIDI_STORAGE_PATH: /corpus
      DATABASE_URL: sqlite:////data/piano_mentor.db
      DATABASE_PATH: /data/piano_mentor.db
      # CORS debe permitir el origen del FRONTEND (el navegador llama a la API
      # desde www...), no el de la API. Se incluyen apex y www porque ambos
      # sirven el frontend.
      CORS_ORIGINS: "${PM_PUBLIC_WEB_URL},https://pianomentoria.com"
      APP_PUBLIC_URL: ${PM_PUBLIC_WEB_URL}
      API_PUBLIC_URL: ${PM_PUBLIC_API_URL}
      AUTOLOGIN: "false"
      # Litestream y el almacenamiento en R2 son de Render/Vercel. Aqui la base
      # vive solo en este portatil: el entrypoint solo arranca litestream si
      # estan las cuatro, y storage.py solo usa R2 si hay credenciales. Vacias
      # = SQLite plano, sin trafico a Cloudflare.
      R2_BUCKET: ""
      R2_ENDPOINT: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
    volumes:
      # Base de datos de PRODUCCION, fuera del repositorio: ni un `git clean`
      # ni un `git reset --hard` del despliegue automatico pueden tocarla.
      # La ruta se define en deploy/.env (PM_DATA_DIR).
      - ${PM_DATA_DIR:?define PM_DATA_DIR en deploy/.env}:/data
      # Corpus MIDI versionado: viaja con el repo, asi que un despliegue lo
      # actualiza. Vive en /corpus y no en /data/midi a proposito: montar una
      # ruta dentro de otra hacia que Docker creara un /data/midi fantasma en
      # el host en cada arranque. Solo lectura porque las subidas estan
      # desactivadas.
      - ../data/midi:/corpus:ro
    expose:
      - "8000"
    networks:
      - web
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------ frontend ---
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${PM_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${PM_PUBLIC_WS_URL}
        NEXT_PUBLIC_AUTOLOGIN: "false"
        NEXT_PUBLIC_ENABLE_MIDI_UPLOAD: ${PM_ENABLE_MIDI_UPLOAD:-false}
    image: pianomentor-frontend:prod
    container_name: pm-frontend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      # Auth.js detrás de Nginx: confía en las cabeceras X-Forwarded-*.
      AUTH_TRUST_HOST: "true"
    expose:
      - "3000"
    networks:
      - web
    depends_on:
      backend:
        condition: service_healthy

  # ------------------------------------------------------- mivia (TODO) ---
  # Proyecto "mivia" (Node + FastAPI). NO está activo: falta el código y el
  # dominio de No-IP. Descomentar y ajustar rutas/puertos cuando toque.
  #
  # mivia-web:
  #   build:
  #     context: ../../mivia          # ~/proyectos/mivia
  #     dockerfile: Dockerfile
  #   container_name: mivia-web
  #   restart: unless-stopped
  #   expose:
  #     - "3000"
  #   networks:
  #     - web
  #
  # mivia-api:
  #   build:
  #     context: ../../mivia
  #     dockerfile: backend/Dockerfile
  #   container_name: mivia-api
  #   restart: unless-stopped
  #   env_file:
  #     - ../../mivia/.env
  #   expose:
  #     - "8000"
  #   networks:
  #     - web

networks:
  web:
    driver: bridge

volumes:
  certbot_webroot:
  certbot_conf:
