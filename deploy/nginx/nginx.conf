# description: Configuración base de Nginx del servidor casero.
# context: Proxy inverso por nombre de dominio; cada sitio vive en conf.d/.

user  nginx;
worker_processes auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" host=$host';

    access_log /var/log/nginx/access.log main;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;

    # Subidas de MIDI y portadas: el límite por defecto (1 MB) se queda corto.
    client_max_body_size 25m;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/json application/javascript
                      application/xml image/svg+xml;

    # WebSocket: "Connection: upgrade" solo cuando el cliente lo pide.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
