# description: Sitio de PianoMentor AI (frontend + API) en Nginx, con HTTPS.
# context: www/apex sirven la web; api sirve FastAPI y el WebSocket. El puerto 80
#          solo mantiene el reto ACME de Let's Encrypt y redirige a HTTPS.

# --- Puerto 80: reto ACME y redirección a HTTPS ----------------------------
server {
    listen 80;
    server_name www.pianomentoria.com pianomentoria.com api.pianomentoria.com;

    # La renovación de Let's Encrypt sigue entrando por HTTP, así que esta ruta
    # va antes que la redirección.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Frontend: www.pianomentoria.com y pianomentoria.com -------------------
server {
    listen 443 ssl;
    http2 on;
    server_name www.pianomentoria.com pianomentoria.com;

    ssl_certificate     /etc/letsencrypt/live/pianomentoria.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pianomentoria.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
    }
}

# --- API y WebSocket: api.pianomentoria.com --------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.pianomentoria.com;

    ssl_certificate     /etc/letsencrypt/live/pianomentoria.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pianomentoria.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    location / {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Necesario para /ws/sessions/{id}
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
