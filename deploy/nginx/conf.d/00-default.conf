# description: Sitio por defecto para dominios no configurados.
# context: Evita que el primer server{} (PianoMentor) capture cualquier visita.

server {
    listen 80 default_server;
    server_name _;
    return 404;
}

# Cualquier HTTPS a un nombre no configurado se rechaza en el handshake, sin
# necesidad de certificado para ese nombre.
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
