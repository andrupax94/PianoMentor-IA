# description: Orquestación local: servicios backend (FastAPI) y frontend (Next.js) con volúmenes de datos.
# context: Arranque reproducible del MVP; base del despliegue local.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      # El volumen monta ./data en /data; sin esto, .env apuntaría a /app/data (inexistente/efímero).
      MIDI_STORAGE_PATH: /data/midi
      DATABASE_URL: sqlite:////data/piano_mentor.db
      # U-005: login simple manual; el autologin nunca funciona en producción.
      AUTOLOGIN: ${AUTOLOGIN:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      # U-006: email de verificación del registro por pasos.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-}
      VERIFICATION_TOKEN_TTL_H: ${VERIFICATION_TOKEN_TTL_H:-24}
      # Resend: con clave vacía el mailer queda hermético (solo log).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-PianoMentor AI <onboarding@resend.dev>}
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      # U-005: OAuth con Google en el front; interpolados desde .env de la raíz.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Login simple: bandera de autologin para el bundle cliente.
      NEXT_PUBLIC_AUTOLOGIN: ${AUTOLOGIN:-false}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
