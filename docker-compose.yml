# description: Orquestación local: servicios backend (FastAPI) y frontend (Next.js) con volúmenes de datos.
# context: Arranque reproducible del MVP; base del despliegue local.

services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
