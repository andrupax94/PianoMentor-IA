# description: Dependencias y config Python del backend (FastAPI, Pydantic, Mido, pytest).
# context: Instalar y fijar versiones del backend.

[project]
name = "piano-mentor-backend"
version = "0.1.0"
description = "Backend FastAPI para PianoMentor AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "mido>=1.3,<2.0",
  "python-multipart>=0.0.12,<1.0",
  "sqlite-vec>=0.1.9,<1.0",
]

[tool.setuptools.package-data]
piano_mentor = ["migrations/*.sql"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.8,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
